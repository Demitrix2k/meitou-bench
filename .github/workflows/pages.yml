name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream Meitou
        run: git clone --filter=blob:none https://github.com/VlcekM/MeitouClient upstream

      - name: Generate data/bench.json
        run: python3 tools/generate.py --repo upstream --ref origin/master

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html assets _site/
          mkdir _site/data
          cp data/bench.json _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
